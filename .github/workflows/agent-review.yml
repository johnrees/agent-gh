name: agent-review
# Reusable: sets the agent-review and agent-threads commit statuses on a pull
# request's head with the caller's GITHUB_TOKEN, so they come from GitHub
# Actions (App 15368) and a ruleset can require them from that App alone. The
# caller's template, events, and permissions are in the README ("Statuses
# from GitHub Actions"). It never checks out or runs the pull request's code:
# it downloads a released agent-gh, reads GitHub's API, and fetches only the
# commits carry-forward compares into a scratch repository.
on:
  workflow_call:
    inputs:
      version:
        description: The agent-gh release that sets the statuses (a tag such as v0.7.0, or latest).
        type: string
        default: latest
      runs-on:
        description: The runner, as a label (ubuntu-latest, ubicloud-standard-2) or a JSON list of labels (["self-hosted","linux"]). Linux only.
        type: string
        default: ubuntu-latest
permissions: {}
jobs:
  status:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 10
    # Declaring permissions drops the defaults, so every read the run makes is
    # named here: contents (the config, compare, fetching commits),
    # pull-requests (the PR, its commits and reviews), issues (comments, label
    # events, reactions, closing issues), statuses (read and set). A caller
    # must grant the same.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    # One run per pull request (or per issue, for a comment on one): every run
    # derives both statuses from GitHub as it stands, so a newer run, on a new
    # head or after a new comment, replaces an older one still in progress. An
    # issue's group cannot name its pull requests, so a run also derives them
    # again after writing, and rewrites them if they changed meanwhile.
    concurrency:
      group: agent-review-status-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Download agent-gh, checked against the release's SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # The release asset for this runner: Linux only, x86_64 or arm64.
          agent_gh_asset() {
            case "$(uname -s)/$(uname -m)" in
              Linux/x86_64) echo agent-gh-linux-x64 ;;
              Linux/aarch64 | Linux/arm64) echo agent-gh-linux-arm64 ;;
              *) echo "agent-gh: this runner is $(uname -s) $(uname -m); the runs-on input must name a Linux x86_64 or arm64 runner" >&2; return 1 ;;
            esac
          }
          asset=$(agent_gh_asset)
          if [ "$VERSION" = latest ]; then base=https://github.com/johnrees/agent-gh/releases/latest/download
          else base="https://github.com/johnrees/agent-gh/releases/download/$VERSION"; fi
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep " $asset\$" SHA256SUMS | sha256sum -c -
          mv "$asset" agent-gh
          chmod +x agent-gh
          ./agent-gh --version
      - name: Set agent-review and agent-threads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./agent-gh status
