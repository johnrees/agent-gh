name: agent-claims
# Reusable: when a pull request closes or merges, removes the claim label from
# each issue it linked or claimed that nothing claims any more, with the
# caller's GITHUB_TOKEN. The label only mirrors claims (README, "Claims"); this
# keeps it in step when John closes a claim's pull request or one merges. It
# never checks out or runs the pull request's code: it downloads a released
# agent-gh and reads GitHub's API.
on:
  workflow_call:
    inputs:
      version:
        description: The agent-gh release to run (a tag such as v0.8.0, or latest).
        type: string
        default: latest
      runs-on:
        description: The runner, as a label (ubuntu-latest, ubicloud-standard-2) or a JSON list of labels (["self-hosted","linux"]). Linux only.
        type: string
        default: ubuntu-latest
permissions: {}
jobs:
  sync:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    # contents (the config's label name), pull-requests (open pull requests,
    # to judge each issue), issues (the issues, their comments, and the label).
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Download agent-gh, checked against the release's SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # The release asset for this runner: Linux only, x86_64 or arm64.
          agent_gh_asset() {
            case "$(uname -s)/$(uname -m)" in
              Linux/x86_64) echo agent-gh-linux-x64 ;;
              Linux/aarch64 | Linux/arm64) echo agent-gh-linux-arm64 ;;
              *) echo "agent-gh: this runner is $(uname -s) $(uname -m); the runs-on input must name a Linux x86_64 or arm64 runner" >&2; return 1 ;;
            esac
          }
          asset=$(agent_gh_asset)
          if [ "$VERSION" = latest ]; then base=https://github.com/johnrees/agent-gh/releases/latest/download
          else base="https://github.com/johnrees/agent-gh/releases/download/$VERSION"; fi
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep " $asset\$" SHA256SUMS | sha256sum -c -
          mv "$asset" agent-gh
          chmod +x agent-gh
          ./agent-gh --version
      - name: Remove the claim label where nothing claims the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./agent-gh claims sync
